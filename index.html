<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Bubbit Reference Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="brand-header">Bubbitler Hub</div>
            <button id="usb-connect">⚡ USB/폴더 연결</button>
            <div id="group-list"></div>
            <button id="add-group">+ 그룹 추가</button>
        </aside>
        
        <main id="board-container">
            <header id="controls">
                <input type="text" id="search-bar" placeholder="검색어를 입력하세요">
                <div id="filter-group"></div>
            </header>
            <div id="board"></div>
        </main>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
